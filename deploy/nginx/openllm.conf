# Reverse proxy + TLS example for the OpenLLM gateway (nginx).
#
# Why this file is SSE-specific: /v1/chat/completions and /v1/messages stream
# Server-Sent Events. With nginx's defaults the proxy buffers the stream, so the
# client sees nothing until the model finishes and a naive `proxy_read_timeout`
# cuts long generations off. The directives marked "SSE" below are what make
# streaming work; the gateway also sends its own keep-alive comments
# (OPENLLM_SSE_KEEPALIVE_SECS) so an idle-but-thinking model does not look dead.
#
# Put the certificate in deploy/nginx/certs/ (fullchain.pem + privkey.pem), or
# change the two ssl_certificate lines to your own paths.

upstream openllm_gateway {
    # Runs on the compose network, so the gateway is reached by its service name
    # (`openllm`). If you run nginx on the host instead, change this to
    # `server 127.0.0.1:8080;` — the gateway publishes on loopback only.
    server openllm:8080;
    keepalive 32;
}

# Plain HTTP: only redirect. Never serve the admin API over plaintext.
# `default_server` matters: the nginx image also ships conf.d/default.conf,
# which would otherwise answer unmatched Hostnames on :80 with a 404.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gateway.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name gateway.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # The gateway buffers the request body in memory and caps it with
    # OPENLLM_MAX_BODY_MIB (32 MiB by default); keep the proxy in step so a
    # rejected body fails here with a clear 413 instead of mid-upstream.
    client_max_body_size 32m;
    client_body_timeout  600s;

    # Upstream calls can legitimately take many minutes, and a single stream may
    # stay open for OPENLLM_STREAM_MAX_SECS (1260s by default). Bound idle gaps
    # instead of total duration: these are read/write *inactivity* timeouts.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 15s;

    # SSE: no buffering, no caching, no compression, and tell the gateway (and
    # any intermediate cache) not to buffer either.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    chunked_transfer_encoding on;
    gzip off;
    add_header X-Accel-Buffering no always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Readiness probe for an external load balancer. The gateway stops accepting
    # connections the moment it receives a shutdown signal, so a drain-aware LB
    # usually sees a connection failure here and must treat that as "not ready"
    # too. The 503 {"status":"draining"} body is only visible to a request that
    # was already being served when the signal arrived (or on a reused
    # keep-alive connection); /api/health stays 200 until the listener closes.
    location = /api/ready {
        proxy_pass http://openllm_gateway;
        proxy_buffering off;
        access_log off;
    }

    location = /api/health {
        proxy_pass http://openllm_gateway;
        access_log off;
    }

    # Model traffic (streaming).
    location /v1/ {
        proxy_pass http://openllm_gateway;
    }

    # Admin console and management API. Restrict this to your network: the
    # gateway's own OPENLLM_ADMIN_TOKEN is the second line of defence.
    location / {
        proxy_pass http://openllm_gateway;
        # allow 10.0.0.0/8;
        # deny all;
    }
}
