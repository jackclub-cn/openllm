name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code structure and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests
        working-directory: web
        run: npm test

      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Check code structure
        run: node scripts/check-code-structure.mjs

      - name: Test structure checks
        run: node --test scripts/check-code-structure.test.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            binary: target/release/openllm
            output: openllm-linux
            checksum: openllm-linux.sha256
          - name: windows
            os: windows-latest
            binary: target/release/openllm.exe
            output: openllm-windows.exe
            checksum: openllm-windows.exe.sha256
          - name: macos
            os: macos-latest
            binary: target/release/openllm
            output: openllm-macos
            checksum: openllm-macos.sha256

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check Rust lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Prepare Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          OUTPUT: ${{ matrix.output }}
          CHECKSUM: ${{ matrix.checksum }}
        run: |
          mkdir -p artifact
          cp "$BINARY" "artifact/$OUTPUT"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd artifact && sha256sum "$OUTPUT" > "$CHECKSUM")
          else
            (cd artifact && shasum -a 256 "$OUTPUT" > "$CHECKSUM")
          fi

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          OUTPUT: ${{ matrix.output }}
          CHECKSUM: ${{ matrix.checksum }}
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $env:BINARY (Join-Path artifact $env:OUTPUT)
          $hash = (Get-FileHash (Join-Path artifact $env:OUTPUT) -Algorithm SHA256).Hash.ToLower()
          "$hash *$env:OUTPUT" | Set-Content (Join-Path artifact $env:CHECKSUM)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openllm-${{ matrix.name }}
          path: artifact
          if-no-files-found: error
          retention-days: 30

  monitoring:
    name: Monitoring artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Validates the Prometheus rules and rule unit tests with promtool, the
      # Grafana dashboard JSON, and that every metric the rules, the rule tests
      # and the dashboard reference is actually declared by /metrics. It needs
      # no running gateway, so it runs in seconds.
      - name: Check alert rules, rule tests and dashboard
        run: ./scripts/check-monitoring.sh

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build, monitoring]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ github.event.head_commit.message }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
