name: Build

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            binary: target/release/openllm
            output: openllm
          - name: windows
            os: windows-latest
            binary: target/release/openllm.exe
            output: openllm.exe
          - name: macos
            os: macos-latest
            binary: target/release/openllm
            output: openllm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Prepare Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          OUTPUT: ${{ matrix.output }}
        run: |
          mkdir -p artifact
          cp "$BINARY" "artifact/$OUTPUT"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd artifact && sha256sum "$OUTPUT" > SHA256SUMS)
          else
            (cd artifact && shasum -a 256 "$OUTPUT" > SHA256SUMS)
          fi

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          OUTPUT: ${{ matrix.output }}
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $env:BINARY (Join-Path artifact $env:OUTPUT)
          $hash = (Get-FileHash (Join-Path artifact $env:OUTPUT) -Algorithm SHA256).Hash.ToLower()
          "$hash *$env:OUTPUT" | Set-Content artifact/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openllm-${{ matrix.name }}
          path: artifact
          if-no-files-found: error
          retention-days: 30
