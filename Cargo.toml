[package]
name = "openllm"
version = "0.3.11"
edition = "2024"
description = "A self-hosted, single-binary LLM gateway with custom routing and usage analytics."
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
globset = "0.4"
hmac = "0.12"
http = "1.3"
httpdate = "1.0"
mime_guess = "2.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.46", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.17", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
